<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Private Call</title>
<style>
:root{--bg:#10141a;--card:#1a212b;--fg:#eef2f7;--mut:#93a0b2;--acc:#3ddc97;--red:#ef5350}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:20px;padding:32px 24px;width:min(92%,420px);text-align:center}
h1{font-size:26px;margin:0 0 8px}
p{color:var(--mut);margin:0 0 22px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:15px 20px;cursor:pointer;background:var(--acc);color:#07231a}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.big{display:block;width:100%;margin:10px 0}
.alt{background:#2b3544;color:var(--fg)}
.red{background:var(--red);color:#fff}
#call{display:none;position:fixed;inset:0;background:#000}
#remote{width:100%;height:100%;object-fit:cover;background:#000}
#local{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:28vw;max-width:150px;border-radius:12px;background:#222;transform:scaleX(-1)}
#status{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:#000a;padding:7px 14px;border-radius:20px;font-size:15px}
#invite{position:absolute;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top,0px));background:#000b;padding:12px;border-radius:14px;display:flex;gap:8px;max-width:520px}
#invite input{flex:1;min-width:0;background:#fff1;border:1px solid #fff3;color:var(--fg);border-radius:10px;padding:10px;font:inherit}
#bar{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;background:linear-gradient(transparent,#000c)}
#bar button{padding:14px 18px}
body.voice #remote,body.voice #local{visibility:hidden}
body.voice #call{background:var(--bg)}
#voiceLabel{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:22px;color:var(--mut)}
body.voice #voiceLabel{display:flex}
</style>
</head>
<body>

<div class="card" id="home">
  <h1>Private Call</h1>
  <p id="homeText">Start a call, then send the link to the one person you want to talk to.</p>
  <div id="startBtns">
    <button class="big" id="bv">Start video call</button>
    <button class="big alt" id="ba">Start voice call</button>
  </div>
  <button class="big" id="bj" style="display:none">Join call</button>
</div>

<div id="call">
  <video id="remote" autoplay playsinline></video>
  <div id="voiceLabel">Voice call</div>
  <video id="local" autoplay playsinline muted></video>
  <div id="status">Starting…</div>
  <div id="invite">
    <input id="link" readonly aria-label="Call link">
    <button id="copy">Copy link</button>
  </div>
  <div id="bar">
    <button class="alt" id="mute">Mute</button>
    <button class="alt" id="cam">Camera off</button>
    <button class="red" id="end">End call</button>
  </div>
</div>

<script>
// ---- Settings --------------------------------------------------------------
// STUN works on most networks. If a call won't connect on some networks
// (e.g. mobile data), add a free TURN server here (see README).
const ICE = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // { urls: 'turn:YOUR_TURN_HOST:443', username: 'USER', credential: 'PASS' }
];

// ---- Helpers ---------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const status = (t) => ($('status').textContent = t);
const params = new URLSearchParams(location.hash.slice(1));
let room = params.get('r');
let mode = params.get('m') === 'voice' ? 'voice' : 'video';

let ws, pc, stream, wake, pending = [], caller = false, ended = false, retry = 0, hb, fullCount = 0;
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));

function newRoom() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a); // 128-bit random ID: impossible to guess
  return [...a].map((b) => b.toString(16).padStart(2, '0')).join('');
}

// ---- Home screen -----------------------------------------------------------
if (room) { // opened from a link
  $('startBtns').style.display = 'none';
  $('bj').style.display = 'block';
  $('bj').textContent = mode === 'voice' ? 'Join voice call' : 'Join video call';
  $('homeText').textContent = 'You were invited to a private call.';
}
function start(m) {
  room = newRoom(); mode = m;
  history.replaceState(null, '', '#r=' + room + '&m=' + m);
  begin();
}
$('bv').onclick = () => start('video');
$('ba').onclick = () => start('voice');
$('bj').onclick = begin;

// ---- Call ------------------------------------------------------------------
async function begin() {
  $('home').style.display = 'none';
  $('call').style.display = 'block';
  if (mode === 'voice') { document.body.classList.add('voice'); $('cam').style.display = 'none'; }
  $('link').value = location.href;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: mode === 'video' });
  } catch (e) {
    return status('Allow microphone' + (mode === 'video' ? ' and camera' : '') + ' access, then reload.');
  }
  $('local').srcObject = stream;
  keepAwake();
  connect();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      keepAwake();
      if (!ended && (!ws || ws.readyState > 1)) connect();
    }
  });
}

async function keepAwake() { // stops the screen from sleeping during the call
  try { wake = await navigator.wakeLock.request('screen'); } catch {}
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + room);
  ws.onopen = () => {
    retry = 0; clearInterval(hb);
    hb = setInterval(() => ws.readyState === 1 && ws.send('ping'), 25000); // keeps the line open
    if (!pc) status('Waiting for the other person…');
  };
  ws.onmessage = async (e) => {
    if (e.data === 'pong') return;
    const m = JSON.parse(e.data);
    if (m.type === 'full') {
      if (++fullCount > 6) { ended = true; status('This call already has two people.'); } else status('Joining…');
    }
    else if (m.type === 'peer-joined' || m.type === 'need-restart') { caller = true; await makePc(); await offer(); }
    else if (m.type === 'peer-left') { if (!pc || pc.connectionState !== 'connected') status('Waiting for the other person…'); }
    else if (m.type === 'bye') { status('The other person ended the call.'); closePc(); }
    else if (m.type === 'offer') {
      caller = false; await makePc();
      await pc.setRemoteDescription(m.sdp); await flush();
      const a = await pc.createAnswer(); await pc.setLocalDescription(a);
      send({ type: 'answer', sdp: pc.localDescription });
    }
    else if (m.type === 'answer' && pc) { await pc.setRemoteDescription(m.sdp); await flush(); }
    else if (m.type === 'ice' && m.c) {
      if (pc && pc.remoteDescription) pc.addIceCandidate(m.c).catch(() => {}); else pending.push(m.c);
    }
  };
  ws.onclose = () => { clearInterval(hb); // auto-reconnect so the call stays on the line
    if (ended) return;
    if (!pc || pc.connectionState !== 'connected') status('Reconnecting…');
    setTimeout(connect, Math.min(1000 * ++retry, 5000));
  };
}

async function flush() { for (const c of pending) await pc.addIceCandidate(c).catch(() => {}); pending = []; }

function closePc() { if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; } }

async function makePc() {
  closePc(); pending = [];
  pc = new RTCPeerConnection({ iceServers: ICE });
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.onicecandidate = (e) => e.candidate && send({ type: 'ice', c: e.candidate });
  pc.ontrack = (e) => { $('remote').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') { status('Connected'); $('invite').style.display = 'none'; }
    else if (s === 'disconnected') status('Connection unstable…');
    else if (s === 'failed') { status('Reconnecting…'); caller ? (makePc().then(offer)) : send({ type: 'need-restart' }); }
  };
}

async function offer() {
  const o = await pc.createOffer();
  await pc.setLocalDescription(o);
  send({ type: 'offer', sdp: pc.localDescription });
}

// ---- Buttons ---------------------------------------------------------------
$('copy').onclick = async () => {
  try {
    if (navigator.share) await navigator.share({ title: 'Join my call', url: location.href });
    else { await navigator.clipboard.writeText(location.href); $('copy').textContent = 'Copied'; }
  } catch {}
};
$('mute').onclick = () => {
  const t = stream.getAudioTracks()[0]; t.enabled = !t.enabled;
  $('mute').textContent = t.enabled ? 'Mute' : 'Unmute';
};
$('cam').onclick = () => {
  const t = stream.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled;
  $('cam').textContent = t.enabled ? 'Camera off' : 'Camera on';
};
$('end').onclick = () => {
  ended = true; send({ type: 'bye' });
  closePc(); ws && ws.close();
  stream && stream.getTracks().forEach((t) => t.stop());
  wake && wake.release().catch(() => {});
  history.replaceState(null, '', location.pathname); location.reload();
};
</script>
</body>
</html>
